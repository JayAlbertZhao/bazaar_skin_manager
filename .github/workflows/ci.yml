name: Source validation

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  release-surface:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: manager/requirements-build.txt
      - run: python -m pip install -r manager/requirements-build.txt
      - run: python -m compileall -q tools tests
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/runtime | Out-Null
          Copy-Item manager/runtime/BazaarSkinManager.Runtime.dll dist/runtime/BazaarSkinManager.Runtime.dll
      - name: Validate adapters
        run: python -m unittest discover -s tests -p test_adapter_registry.py -v
      - name: Validate generator
        run: python -m unittest discover -s tests -p test_asset_generator_core.py -v
      - name: Validate audio and manager
        run: |
          python -m unittest discover -s tests -p test_audio_manifest_validator.py -v
          python -m unittest discover -s tests -p test_manager.py -v
          python -m unittest discover -s tests -p test_mod_studio.py -v
      - name: Validate release surface
        run: python -m unittest discover -s tests -p test_release_surface.py -v
      - name: Validate compiled runtime
        run: python -m unittest discover -s tests -p test_runtime_behavior.py -v
      - name: Validate runtime contracts
        run: python -m unittest discover -s tests -p test_runtime_structure.py -v
      - name: Validate asset builder
        run: python -m unittest discover -s tests -p test_skin_pack_builder.py -v
