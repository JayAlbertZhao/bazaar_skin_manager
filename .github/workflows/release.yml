name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix"
        required: true
        default: "1.4.4"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    env:
      SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
      SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: manager/requirements-build.txt

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
            $version = $version -replace '-experimental$', ''
          } else {
            $version = "${{ inputs.version }}"
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Install build dependencies
        run: python -m pip install -r manager/requirements-build.txt

      - name: Validate release surface
        shell: pwsh
        run: |
          python -m py_compile tools/bazaar_skin_manager.py tools/mod_studio_core.py tools/bazaar_skin_manager_ui.py tools/bazaar_skin_manager_ui_v12.py tools/update_service.py tools/support_report.py tools/adapter_registry.py tools/skin_pack_builder.py tools/asset_generator_core.py tools/asset_generator_ui.py tools/manual_slot_editor.py tools/badge_pipeline.py tools/spine_manager_core.py tools/spine_static_preview.py tools/bazaar_spine_manager_ui.py
          New-Item -ItemType Directory -Force dist/runtime | Out-Null
          Copy-Item manager/runtime/BazaarSkinManager.Runtime.dll dist/runtime/BazaarSkinManager.Runtime.dll
          Copy-Item manager/runtime/runtime-build.json dist/runtime/runtime-build.json
          python -m unittest discover -s tests -v

      - name: Build manager
        shell: pwsh
        run: .\build-manager.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Sign software executables
        if: env.SIGNING_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "windows-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificate,
            [Convert]::FromBase64String($env:SIGNING_CERT_BASE64)
          )
          .\sign-windows-binary.ps1 `
            -Path .\dist\manager\TheBazaarModManager.exe `
            -CertificatePath $certificate `
            -CertificatePassword $env:SIGNING_CERT_PASSWORD
          $metadataPath = ".\dist\manager\manager-build.json"
          $metadata = Get-Content $metadataPath -Raw | ConvertFrom-Json
          $metadata.sha256 = (Get-FileHash .\dist\manager\TheBazaarModManager.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $metadata.bytes = (Get-Item .\dist\manager\TheBazaarModManager.exe).Length
          $metadata | ConvertTo-Json -Depth 3 | Set-Content $metadataPath -Encoding utf8

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: .\build-installer.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Sign installer
        if: env.SIGNING_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          .\sign-windows-binary.ps1 `
            -Path ".\dist\installer\TheBazaarModManager-Setup-$version.exe" `
            -CertificatePath (Join-Path $env:RUNNER_TEMP "windows-signing.pfx") `
            -CertificatePassword $env:SIGNING_CERT_PASSWORD
          $installer = ".\dist\installer\TheBazaarModManager-Setup-$version.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($installer))" |
            Set-Content "$installer.sha256" -Encoding ascii

      - name: Build portable ZIPs
        shell: pwsh
        run: .\package-manager-portable.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TheBazaarModManager-${{ steps.version.outputs.value }}
          path: |
            dist/installer/TheBazaarModManager-Setup-${{ steps.version.outputs.value }}.exe
            dist/installer/TheBazaarModManager-Setup-${{ steps.version.outputs.value }}.exe.sha256
            dist/TheBazaarModManager-Portable-${{ steps.version.outputs.value }}.zip
            dist/TheBazaarModManager-Portable-${{ steps.version.outputs.value }}.zip.sha256

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = "${{ steps.version.outputs.value }}"
          $assets = @(
            "dist/installer/TheBazaarModManager-Setup-$version.exe",
            "dist/installer/TheBazaarModManager-Setup-$version.exe.sha256",
            "dist/TheBazaarModManager-Portable-$version.zip",
            "dist/TheBazaarModManager-Portable-$version.zip.sha256"
          )
          $changelog = Get-Content "CHANGELOG.md" -Raw
          $escapedVersion = [Regex]::Escape($version)
          $section = [Regex]::Match(
            $changelog,
            "(?ms)^##\s+$escapedVersion(?:\s+\([^)]+\))?\s*\r?\n(?<body>.*?)(?=^##\s+|\z)"
          )
          if (-not $section.Success) {
            throw "CHANGELOG.md has no section for $version"
          }
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes-$version.md"
          $notes = "## Changes`r`n`r`n$($section.Groups['body'].Value.Trim())`r`n"
          [IO.File]::WriteAllText(
            $notesPath,
            $notes,
            [Text.UTF8Encoding]::new($false)
          )
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
            gh release edit $tag `
              --title "The Bazaar Skin Manager $tag" `
              --notes-file $notesPath
          } else {
            $arguments = @(
              "release", "create", $tag
            ) + $assets + @(
              "--verify-tag",
              "--notes-file", $notesPath,
              "--title", "The Bazaar Skin Manager $tag"
            )
            if ($tag.EndsWith("-experimental")) {
              $arguments += "--prerelease"
            }
            & gh @arguments
          }
